plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = rootProject.group
version = rootProject.version

base { archivesName = "${mod_id}-api-${minecraft_version}" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

neoForge { neoFormVersion = neo_form_version }

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}

// Compile a consumer against the jar, not HI's implementation or API source output.
sourceSets.create('consumer') {
    compileClasspath = files(tasks.named('jar').flatMap { it.archiveFile }) + sourceSets.main.compileClasspath
}
tasks.named('compileConsumerJava') { dependsOn tasks.named('jar') }
tasks.named('check') { dependsOn tasks.named('compileConsumerJava') }

configurations.create('apiJava') {
    canBeResolved = false
    canBeConsumed = true
}
artifacts { apiJava sourceSets.main.java.sourceDirectories.singleFile }

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE.md')) { rename { "${it}_${mod_name}" } }
}
