plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// Each loader compiles the common Java sources, so all modules need the processor.
dependencies {
    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"
    testCompileOnly "org.projectlombok:lombok:${lombok_version}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

sourcesJar {
    from(rootProject.file('LICENSE.md')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE.md')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version,
            'cloth_config_version'         : cloth_config_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}

// One authoring catalog, emitted as ordinary overridable datapack resources in every module.
def catalog = rootProject.layout.projectDirectory.file('common/src/main/weight-defaults.json')
def generated = layout.buildDirectory.dir('generated/weight-defaults')
def generateWeights = tasks.register('generateWeightDefaults') {
    group = 'build'
    description = 'Generates per-item datapack resources from the curated default weight catalog.'
    inputs.file(catalog)
    outputs.dir(generated)
    doLast {
        def source = new groovy.json.JsonSlurper().parse(catalog.asFile, 'UTF-8')
        if (source.version != 1 || source.unit != 'lb' || !(source.groups instanceof List)) {
            throw new GradleException('Invalid default weight catalog')
        }
        def values = new TreeMap<String, Object>()
        source.groups.each { group ->
            if (!(group.weight instanceof Number) || !group.reason || !(group.items instanceof List) || group.items.empty) {
                throw new GradleException('Each default group needs a reason, numeric weight, and items')
            }
            def decimal = new BigDecimal(group.weight.toString())
            if (decimal < 0 || decimal > 1000000000 || (decimal > 0 && decimal.floatValue() == 0)) {
                throw new GradleException("Invalid default weight: ${group.weight}")
            }
            group.items.each { id ->
                if (!(id instanceof String) || !(id ==~ '[a-z0-9_.-]+:[a-z0-9_./-]+')
                        || id.replace(':', '/').split('/', -1).any { it.empty || it == '.' || it == '..' }) {
                    throw new GradleException("Invalid default item ID: ${id}")
                }
                if (values.putIfAbsent(id, group.weight) != null) throw new GradleException("Duplicate default: ${id}")
            }
        }
        def output = generated.get().asFile
        if (!output.canonicalPath.startsWith(layout.buildDirectory.get().asFile.canonicalPath + File.separator)) {
            throw new GradleException('Generated output must stay within the module build directory')
        }
        // This is a dedicated generated directory; remove stale definitions after catalog deletions.
        project.delete(output)
        values.each { id, weight ->
            def parts = id.split(':', 2)
            def target = new File(output, "data/${parts[0]}/heavyinventories/weights/${parts[1]}.json")
            target.parentFile.mkdirs()
            target.setText(groovy.json.JsonOutput.toJson([weight: weight]) + '\n', 'UTF-8')
        }
    }
}
tasks.named('processResources') {
    dependsOn generateWeights
    from(generated)
}
