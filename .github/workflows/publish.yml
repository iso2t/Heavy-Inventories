name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v plus the Gradle version)
        required: true
        type: string
      mode:
        description: dry-run previews only; preflight reads APIs; publish uploads
        type: choice
        options: [dry-run, preflight, publish]
        default: dry-run
      recovery:
        description: Recovery evidence JSON only after inspecting an ambiguous upload
        type: string
        default: '{}'

permissions:
  contents: read

# One shared group for live attempts. Do not interrupt a partially completed upload.
concurrency:
  group: ${{ (github.event_name == 'push' || inputs.mode == 'publish') && 'publish-live' || format('publish-preview-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Resolve existing tag and verify release branch ancestry
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: python scripts/release/release.py resolve

  build:
    needs: resolve
    uses: ./.github/workflows/build-reusable.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      release_tag: ${{ needs.resolve.outputs.tag }}

  preview:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-bundle
          path: build/release/bundle
      - name: Preview destinations without credentials or network access
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: python scripts/release/release.py preview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-preview
          path: build/release/publish-preview.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [resolve, build, preview]
    if: github.event_name == 'push' || inputs.mode != 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-bundle
          path: build/release/bundle
      - name: Check publication gate
        if: github.event_name == 'push' || inputs.mode == 'publish'
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          if [ "$PUBLISH_ENABLED" != "true" ]; then
            echo 'Publishing disabled. Review the release-bundle and release-preview artifacts; enable PUBLISH_ENABLED and use manual publish when ready.'
            exit 1
          fi
      - name: Preflight or publish the verified release
        env:
          RELEASE_MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RECOVERY: ${{ inputs.recovery || '{}' }}
        run: python scripts/release/release.py "$RELEASE_MODE"
      - name: Preserve local upload receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-receipts
          path: build/release/receipts/
          if-no-files-found: ignore
          retention-days: 90
