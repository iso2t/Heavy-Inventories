gradle.projectsEvaluated {
    [gradle.rootProject.project(':fabric'), gradle.rootProject.project(':neoforge')].each { modProject ->
        def testJar = project(':tests').tasks.named('jar', Jar)
        ['runServer', 'runClient'].each { runName ->
            modProject.tasks.named(runName) {
                if (modProject.hasProperty('datapackSmoke')) {
                    systemProperty 'heavyinventories.test.datapacks', 'true'
                }
                if (modProject.hasProperty('newWorldHandoff')) {
                    systemProperty 'heavyinventories.test.newWorldHandoff', 'true'
                }
                if (modProject.hasProperty('allowTestWorldUpgrade')) {
                    systemProperty 'heavyinventories.test.allowWorldUpgrade', 'true'
                }
                if (modProject.hasProperty('authorityMultiplayer')) {
                    systemProperty 'heavyinventories.test.multiplayer', 'true'
                }
                if (modProject.hasProperty('packagedSmoke')) {
                    dependsOn modProject.tasks.named('jar')
                    def modJar = modProject.tasks.named('jar').get().archiveFile.get().asFile
                    def outputs = modProject.sourceSets.main.output.files
                    classpath = classpath.filter { !outputs.contains(it) } + modProject.files(modJar)
                    if (modProject.name == 'neoforge') {
                        // ModDev appends this provider again in its task action.
                        def runtimeFiles = classpathProvider.files
                        classpathProvider.setFrom(runtimeFiles.findAll { !outputs.contains(it) })
                        if (runName == 'runServer' && modProject.hasProperty('withoutCloth')) {
                            def keepDependency = { !it.name.startsWith('cloth-config-') && !it.name.startsWith('basic-math-') }
                            classpath = classpath.filter(keepDependency)
                            classpathProvider.setFrom(runtimeFiles.findAll { !outputs.contains(it) && keepDependency(it) })
                        }
                    }
                    doFirst {
                        if (modProject.name == 'fabric') systemProperty 'fabric.addMods', modJar.absolutePath
                        else environment 'MOD_CLASSES', "heavyinventories%%${modJar.absolutePath}"
                        println "PACKAGED MOD: ${modJar}"
                        if (runName == 'runClient') {
                            args '--username', "Step2${modProject.name.capitalize()}", '--width', '1100', '--height', '700'
                            if (modProject.hasProperty('smokeMultiplayer'))
                                args '--quickPlayMultiplayer', "127.0.0.1:${modProject.name == 'fabric' ? '25575' : '25576'}"
                        }
                    }
                }
                dependsOn testJar
                classpath += modProject.files(testJar.flatMap { it.archiveFile })
                if (runName == 'runServer') {
                    standardInput = System.in
                    if (modProject.name == 'fabric') {
                        doFirst {
                            if (!args.contains('--nogui')) args '--nogui'
                        }
                    }
                }
                if (runName == 'runClient') {
                    doFirst {
                        if (modProject.hasProperty('authorityMultiplayer')) return
                        if (!modProject.hasProperty('lifecycleClientWorld')) {
                            throw new GradleException('Specify -PlifecycleClientWorld=<disposable save folder>; this test replaces inventory and respawns the player.')
                        }
                        args '--quickPlaySingleplayer', modProject.property('lifecycleClientWorld').toString()
                    }
                }
            }
        }
    }
}
